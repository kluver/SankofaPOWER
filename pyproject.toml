[project]
name = "sankofapower"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Kluver", email = "kluve018@umn.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
]

[project.scripts]
sankofapower = "sankofapower:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "sankofapower.main:app"