# Dev stack: `docker compose up` runs the database, API and web app with live reload.
# The devcontainer (.devcontainer/) reuses the `db` service from this file.
name: sankofapower

services:
  db:
    # Postgres + PostGIS, needed for distance / radius / census tract queries.
    # imresamu/postgis is the multi-arch build of postgis/postgis (which is amd64-only),
    # so it runs natively on Apple Silicon and Intel.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync && uv run alembic upgrade head && uv run fastapi dev --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      # keep the Linux venv out of the repo folder so it doesn't clash with a local .venv
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    volumes:
      - .:/app
      - api-venv:/venv
      - uv-cache:/root/.cache/uv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-bookworm-slim
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    volumes:
      - .:/app
      # Linux node_modules live in a volume, separate from any macOS web/node_modules
      - web-node-modules:/app/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  api-venv:
  uv-cache:
  web-node-modules:
